<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f3eee5"
  >

  <title>Prayer Times</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Lora:wght@600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="widget">

    <div class="widget-heading">
      <span>Daily worship</span>
      <h1>Today’s Prayers</h1>
    </div>

    <section class="prayers">

      <article class="prayer">
        <div class="icon">🌅</div>

        <div class="name">Fajr</div>
        <div class="time" id="fajr">--:--</div>
      </article>

      <article class="prayer">
        <div class="icon">☀️</div>

        <div class="name">Dhuhr</div>
        <div class="time" id="dhuhr">--:--</div>
      </article>

      <article class="prayer">
        <div class="icon">🌤️</div>

        <div class="name">Asr</div>
        <div class="time" id="asr">--:--</div>
      </article>

      <article class="prayer">
        <div class="icon">🌇</div>

        <div class="name">Maghrib</div>
        <div class="time" id="maghrib">--:--</div>
      </article>

      <article class="prayer">
        <div class="icon">🌙</div>

        <div class="name">Isha</div>
        <div class="time" id="isha">--:--</div>
      </article>

    </section>

    <section class="details-row">

      <div class="detail-card countdown">
        <div class="detail-icon">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M12 8v4l2.5 2"></path>
          </svg>
        </div>

        <div class="detail-copy">
          <span>Next prayer</span>
          <strong id="nextPrayer">Loading...</strong>
        </div>
      </div>

      <div class="detail-card qibla">
        <div class="detail-icon">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M15.5 8.5l-2 5-5 2 2-5 5-2Z"></path>
          </svg>
        </div>

        <div class="detail-copy">
          <span>Qibla direction</span>
          <strong>118° SE ↘</strong>
        </div>
      </div>

    </section>

  </main>

  <script src="script.js?v=3"></script>
<script>
  function sendPrayerWidgetHeight() {
    const widget = document.querySelector(".widget");

    if (!widget) return;

    const height = Math.ceil(document.documentElement.scrollHeight);

    window.parent.postMessage(
      {
        type: "prayer-widget-height",
        height: height
      },
      "*"
    );
  }

  window.addEventListener("load", sendPrayerWidgetHeight);
  window.addEventListener("resize", sendPrayerWidgetHeight);

  const widget = document.querySelector(".widget");

  if (widget && "ResizeObserver" in window) {
    new ResizeObserver(sendPrayerWidgetHeight).observe(widget);
  }
</script>
</body>
</html>
