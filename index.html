<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f3eee5"
  >

  <title>Prayer Times</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="widget">

    <div class="widget-heading">
      <span>Daily worship</span>
      <h1>Today’s Prayers</h1>
    </div>

    <section class="prayers">

      <article class="prayer">
        <div class="icon">
          <svg
            viewBox="0 0 32 32"
            aria-hidden="true"
          >
            <path d="M5 22h22"></path>
            <path d="M8 18a8 8 0 0 1 16 0"></path>
            <path d="M16 5v5"></path>
            <path d="M7.5 9.5l3 3"></path>
            <path d="M24.5 9.5l-3 3"></path>
          </svg>
        </div>

        <div class="name">Fajr</div>
        <div class="time" id="fajr">--:--</div>
      </article>

      <article class="prayer">
        <div class="icon">
          <svg
            viewBox="0 0 32 32"
            aria-hidden="true"
          >
            <circle cx="16" cy="16" r="5"></circle>
            <path d="M16 3v5"></path>
            <path d="M16 24v5"></path>
            <path d="M3 16h5"></path>
            <path d="M24 16h5"></path>
            <path d="M6.8 6.8l3.5 3.5"></path>
            <path d="M21.7 21.7l3.5 3.5"></path>
            <path d="M25.2 6.8l-3.5 3.5"></path>
            <path d="M10.3 21.7l-3.5 3.5"></path>
          </svg>
        </div>

        <div class="name">Dhuhr</div>
        <div class="time" id="dhuhr">--:--</div>
      </article>

      <article class="prayer">
        <div class="icon">
          <svg
            viewBox="0 0 32 32"
            aria-hidden="true"
          >
            <circle cx="12" cy="11" r="4"></circle>
            <path d="M12 4v3"></path>
            <path d="M5 11h3"></path>
            <path d="M7.1 6.1l2.1 2.1"></path>
            <path d="M16.9 6.1l-2.1 2.1"></path>
            <path d="M8 24h16"></path>
            <path d="M10 24a6 6 0 0 1 11.5-2.4"></path>
            <path d="M21 24a4 4 0 1 0-1-7.9"></path>
          </svg>
        </div>

        <div class="name">Asr</div>
        <div class="time" id="asr">--:--</div>
      </article>

      <article class="prayer">
        <div class="icon">
          <svg
            viewBox="0 0 32 32"
            aria-hidden="true"
          >
            <path d="M5 22h22"></path>
            <path d="M8 18a8 8 0 0 1 16 0"></path>
            <path d="M16 15v5"></path>
            <path d="M7.5 12.5l3 3"></path>
            <path d="M24.5 12.5l-3 3"></path>
          </svg>
        </div>

        <div class="name">Maghrib</div>
        <div class="time" id="maghrib">--:--</div>
      </article>

      <article class="prayer">
        <div class="icon">
          <svg
            viewBox="0 0 32 32"
            aria-hidden="true"
          >
            <path d="M21.5 22.5A9 9 0 1 1 17 6a7.5 7.5 0 0 0 4.5 16.5Z"></path>
            <path d="M23 7v4"></path>
            <path d="M21 9h4"></path>
          </svg>
        </div>

        <div class="name">Isha</div>
        <div class="time" id="isha">--:--</div>
      </article>

    </section>

    <section class="details-row">

      <div class="detail-card countdown">
        <div class="detail-icon">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M12 8v4l2.5 2"></path>
          </svg>
        </div>

        <div class="detail-copy">
          <span>Next prayer</span>
          <strong id="nextPrayer">Loading...</strong>
        </div>
      </div>

      <div class="detail-card qibla">
        <div class="detail-icon">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M15.5 8.5l-2 5-5 2 2-5 5-2Z"></path>
          </svg>
        </div>

        <div class="detail-copy">
          <span>Qibla direction</span>
          <strong>118° South-East</strong>
        </div>
      </div>

    </section>

  </main>

  <script src="script.js?v=3"></script>

</body>
</html>
